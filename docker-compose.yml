services:
  postgres:
    image: postgres:16-alpine
    container_name: shearsimp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shearsimp
      POSTGRES_PASSWORD: shearsimp_dev
      POSTGRES_DB: shearsimp
    ports:
      - "5432:5432"
    volumes:
      - shearsimp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shearsimp -d shearsimp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shearsimp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - shearsimp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shearsimp_postgres_data:
  shearsimp_redis_data:
